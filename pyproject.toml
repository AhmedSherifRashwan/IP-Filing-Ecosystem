[project]
name = "ip-filing-ecosystem"
version = "0.1.0"
description = "Script-driven seven-agent patent drafting ecosystem running on OpenClaw"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "python-docx>=1.2.0",
    "pyyaml>=6.0",
    "reportlab>=5.0.1",
]

[project.scripts]
ipfe = "ecosystem.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecosystem"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
